name: Release

# Publishes a GitHub Release for a vX.Y.Z tag with GoReleaser. Pushing the tag
# triggers it; run it manually with a tag to publish or republish an existing
# tag (for example v0.1.0). Tags with a pre-release suffix (v0.2.0-rc.1) are
# published as pre-releases and never become "latest".
#
# The sources come from the tag, but the release tooling (.goreleaser.yaml and
# scripts/release-notes) always comes from the ref this workflow runs from, so
# republishing a tag older than that tooling still works.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish or republish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate the tag name
        run: |
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$TAG' is not a vMAJOR.MINOR.PATCH[-prerelease] tag."
            exit 1
          fi

      - name: Check out the tagged sources
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          fetch-tags: true

      - name: Confirm the checkout is the tagged commit
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"

      - name: Take the release tooling from the workflow ref
        # .goreleaser.yaml and scripts/release-notes were added after v0.1.0,
        # so the tagged tree may not contain them at all. Read both from the
        # commit this workflow itself runs from and keep them in RUNNER_TEMP,
        # outside the working tree, so GoReleaser still sees a clean checkout
        # of the tag and builds exactly the tagged sources.
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin "$WORKFLOW_SHA"
          tooling="$RUNNER_TEMP/release-tooling"
          mkdir -p "$tooling"
          git cat-file -p "$WORKFLOW_SHA:.goreleaser.yaml" > "$tooling/goreleaser.yaml"
          git cat-file -p "$WORKFLOW_SHA:scripts/release-notes" > "$tooling/release-notes"
          chmod +x "$tooling/release-notes"
          echo "TOOLING=$tooling" >> "$GITHUB_ENV"
          echo "Release tooling taken from $WORKFLOW_SHA."
          # The archives ship LICENSE, README.md and CHANGELOG.md, and
          # GoReleaser fails when one of them is missing (v0.1.0 predates the
          # LICENSE file). Fill a gap from the workflow ref and hide the copy
          # from Git so the tag checkout stays clean.
          for file in LICENSE README.md CHANGELOG.md; do
            if [ ! -e "$file" ]; then
              git cat-file -p "$WORKFLOW_SHA:$file" > "$file"
              echo "/$file" >> .git/info/exclude
              echo "$TAG has no $file; using the one from the workflow ref."
            fi
          done

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Write release notes from CHANGELOG.md
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          if "$TOOLING/release-notes" "$TAG" CHANGELOG.md > "$notes"; then
            echo "Using the CHANGELOG.md section for ${TAG#v}."
          elif [[ "$TAG" == *-* ]]; then
            echo "No CHANGELOG.md section for ${TAG#v}; using [Unreleased] for the pre-release."
            {
              echo "Pre-release $TAG. Changes since the last release, from the [Unreleased] section of CHANGELOG.md:"
              echo
              "$TOOLING/release-notes" Unreleased CHANGELOG.md || echo "_No changelog entries since the last release._"
            } > "$notes"
          else
            echo "::error::CHANGELOG.md has no '## [${TAG#v}]' section. Add it (see AGENTS.md) before releasing."
            exit 1
          fi
          {
            echo
            echo "---"
            echo
            echo "Verify a download with \`sha256sum -c --ignore-missing checksums.txt\`. Full history: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md)."
          } >> "$notes"
          echo "NOTES=$notes" >> "$GITHUB_ENV"
          echo "::group::Release notes"
          cat "$notes"
          echo "::endgroup::"

      - name: Decide whether this release becomes latest
        # Only the highest stable tag may be "latest", so republishing an
        # older tag or publishing a pre-release never moves it.
        run: |
          highest=$(git tag --list 'v[0-9]*' | grep -v -- '-' | sort -V | tail -n 1)
          if [[ "$TAG" == *-* ]] || [ "$TAG" != "$highest" ]; then
            echo "MAKE_LATEST=false" >> "$GITHUB_ENV"
            echo "$TAG will not be marked latest (highest stable tag: $highest)."
          else
            echo "MAKE_LATEST=true" >> "$GITHUB_ENV"
            echo "$TAG will be marked latest."
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --config "${{ env.TOOLING }}/goreleaser.yaml" --release-notes "${{ env.NOTES }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}
          MAKE_LATEST: ${{ env.MAKE_LATEST }}
